   # Monte Carlo Simulation Configuration
   test_statistics:
     - kolmogorov_smirnov
     - durbin_watson
     - anderson_darling
   
   sample_sizes: [30, 50, 100, 500, 1000]
   
   iterations:
     initial: 1000000      # 1M iterations
     convergence_check: 5000000  # 5M iterations
     maximum: 10000000     # 10M max iterations
   
   quantiles: [0.75, 0.90, 0.95, 0.99]
   
   null_distribution: standard_normal
   random_seed: 42
   
   # Parallel processing
   n_jobs: -1  # Use all available cores
