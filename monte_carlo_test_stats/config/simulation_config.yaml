   # Monte Carlo Simulation Configuration
   test_statistics:
     - kolmogorov_smirnov
     - durbin_watson
     - anderson_darling
   
   sample_sizes: [30, 50, 100, 500, 1000]
   
   iterations:
     initial: 1_000_000          # 1M iterations
     convergence_check: 5_000_000  # 5M iterations
     maximum: 10_000_000         # 10M max iterations
   
   quantiles: [0.75, 0.90, 0.95, 0.99]
   
   null_distribution: standard_normal
   random_seed: 42
   
   # Resource utilization
   parallel:
     n_jobs: -1                  # Use all CPU cores (-1 = all)
     backend: loky               # Joblib backend (loky/threading/multiprocessing)
     batch_size: 10_000          # Items per job for load balancing
     max_nbytes: 1M              # Threshold for memmapping large arrays
     verbose: 10                 # Progress output level
   
   # Memory management
   memory:
     chunk_size: 100_000         # Process data in chunks to manage RAM
     enable_compression: true    # Compress checkpoints
